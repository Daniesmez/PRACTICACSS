<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DICCIONARIO.COM</title>
<style>
    /* Fuente y reset */
    * {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #f0f4f8, #d0e0ff);
        text-align: center;
    }

    header {
        background-color: #4a90e2;
        color: white;
        padding: 2rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .Bienvenida h2 {
        margin: 2rem 0;
        color: #2c3e50;
        font-weight: 600;
    }

    /* Tabla de letras */
    .TablaDiccionario table {
        margin: 2rem auto;
        border-collapse: separate;
        border-spacing: 15px;
    }

    .TablaDiccionario td {
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
        background: #4a90e2;
        border-radius: 15px;
        text-align: center;
        vertical-align: middle;
        transition: all 0.3s ease;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .TablaDiccionario td a {
        text-decoration: none;
        color: inherit;
        display: block;
        width: 100%;
        height: 100%;
        line-height: 60px;
    }

    /* Efecto hover */
    .TablaDiccionario td:hover {
        transform: translateY(-5px) scale(1.1);
        background: linear-gradient(135deg, #f39c12, #e74c3c);
        cursor: pointer;
        color: white;
        box-shadow: 0 8px 12px rgba(0,0,0,0.3);
    }

    /* Letras no clicables */
    .TablaDiccionario td.no-link {
        background: #bdc3c7;
        color: #2c3e50;
        cursor: default;
        transform: none;
    }

</style>
</head>
<body>

<header>
    <h1>DICCIONARIO.COM</h1>
</header>

<div class="Bienvenida">
    <h2>Bienvenidos al sitio de las mejores definiciones de Panamá</h2>
</div>

<div class="TablaDiccionario">
    <table>
        <tr>
            <td><a href="pagina_letraA.html">A</a></td> 
            <td><a href="pagina_letraB.html">B</a></td> 
            <td class="no-link">C</td>
            <td><a href="pagina_letraD.html">D</a></td>
            <td><a href="pagina_letraE.html">E</a></td>
        </tr>
        <tr>
            <td class="no-link">F</td>
            <td class="no-link">G</td>
            <td><a href="pagina_letraH.html">H</a></td> 
            <td class="no-link">I</td>
            <td class="no-link">J</td>
        </tr>
        <tr>
            <td class="no-link">K</td>
            <td class="no-link">L</td>
            <td class="no-link">M</td>
            <td class="no-link">N</td>
            <td class="no-link">O</td>
        </tr>
        <tr>
            <td class="no-link">P</td>
            <td class="no-link">Q</td>
            <td class="no-link">R</td>
            <td class="no-link">S</td>
            <td class="no-link">T</td>
        </tr>
        <tr>
            <td class="no-link">U</td>
            <td class="no-link">V</td>
            <td class="no-link">W</td>
            <td class="no-link">X</td>
            <td class="no-link">Y</td>
        </tr>
    </table>
</div>

</body>
</html>
